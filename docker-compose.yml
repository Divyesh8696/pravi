version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: msw-mongo-repl
    restart: unless-stopped
    ports:
      - "27017:27017"
    entrypoint: [ "/bin/bash", "-c", "openssl rand -base64 756 > /tmp/keyfile.txt && chmod 400 /tmp/keyfile.txt && mongod --replSet rs0 --bind_ip_all" ]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "try { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) } catch(e) { rs.status().ok }"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
